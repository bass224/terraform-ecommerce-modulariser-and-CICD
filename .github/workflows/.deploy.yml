name: Terraform Deployment

on:
  push:
    branches:
      - 'dev'
      - 'dev/**'
      - 'main'

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      SQL_DATABASE_LOGIN: ${{ secrets.SQL_SERVER_DATABASE_LOGIN }}
      SQL_DATABASE_PASSWORD: ${{ secrets.SQL_SERVER_DATABASE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.4

      # Détermine le chemin d'environnement selon la branche
      - name: Set environment path
        id: setpath
        run: |
          branch="${GITHUB_REF_NAME}"
          echo "Current branch: $branch"

          if [[ "$branch" == dev/* || "$branch" == "dev" ]]; then
            echo "env_path=terraform/envs/dev" >> $GITHUB_OUTPUT
          elif [[ "$branch" == "main" ]]; then
            echo "env_path=terraform/envs/prod" >> $GITHUB_OUTPUT
          else
            echo "Branch not recognized, skipping"
            exit 1
          fi

      # Initialisation Terraform
      - name: Terraform Init
        run: terraform -chdir=${{ steps.setpath.outputs.env_path }} init

      # Plan Terraform
      - name: Terraform Plan
        run: terraform -chdir=${{ steps.setpath.outputs.env_path }} plan -out=tfplan
        env:
          TF_VAR_sql_database_login: ${{ env.SQL_DATABASE_LOGIN }}
          TF_VAR_sql_database_password: ${{ env.SQL_DATABASE_PASSWORD }}

      # Application du plan Terraform
      - name: Terraform Apply
        if: startsWith(github.ref_name, 'dev/') || github.ref_name == 'dev' || github.ref_name == 'main'
        run: terraform -chdir=${{ steps.setpath.outputs.env_path }} apply -auto-approve tfplan
        env:
          TF_VAR_sql_database_login: ${{ env.SQL_DATABASE_LOGIN }}
          TF_VAR_sql_database_password: ${{ env.SQL_DATABASE_PASSWORD }}
