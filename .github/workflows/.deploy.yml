name: Terraform Deployment

on:
  push:
    branches:
      - dev
      - 'dev/**'    
      - main
  pull_request:

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.4

      # Déterminer le dossier en fonction de la branche
      - name: Set environment path
        id: setpath
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "env_path=envs/dev" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "env_path=envs/prod" >> $GITHUB_OUTPUT
          else
            echo "Branch not recognized, skipping"
            exit 1
          fi

      # Initialisation Terraform
      - name: Terraform Init
        run: terraform -chdir=${{ steps.setpath.outputs.env_path }} init

      # Plan Terraform
      - name: Terraform Plan
        run: terraform -chdir=${{ steps.setpath.outputs.env_path }} plan -out=tfplan

      # Apply automatique (optionnel : tu peux mettre "if: github.ref_name == 'main'" pour limiter à prod)
      - name: Terraform Apply
        if: github.ref_name == 'main' || github.ref_name == 'dev'
        run: terraform -chdir=${{ steps.setpath.outputs.env_path }} apply -auto-approve tfplan
